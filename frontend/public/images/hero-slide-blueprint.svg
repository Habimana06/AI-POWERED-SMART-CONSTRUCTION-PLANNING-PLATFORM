  <rect x="520" y="260" width="280" height="160" fill="none" stroke="#E67E22" stroke-width="3"/>
  <rect x="280" y="460" width="520" height="200" fill="none" stroke="#E67E22" stroke-width="3"/>
  <text x="980" y="280" fill="#2C3E50" font-family="system-ui,sans-serif" font-size="44" font-weight="700">Blueprints &amp;</text>
  <text x="980" y="340" fill="#E67E22" font-family="system-ui,sans-serif" font-size="44" font-weight="700">Full-House Renders</text>
