services:
  mysql:
    image: mysql:8.0
    container_name: buildplan-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root2026
      MYSQL_DATABASE: buildplan_ai
      MYSQL_USER: buildplan
      MYSQL_PASSWORD: buildplan2026
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ubuildplan", "-pbuildplan2026"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buildplan-backend
    restart: unless-stopped
    env_file:
      - ./.env
      - ./backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      PORT: 5000
      FRONTEND_URL: http://localhost:8081,http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    container_name: buildplan-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  mysql_data:
